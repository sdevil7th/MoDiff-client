name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Client quality
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: MoDiff-client
    env:
      CI: true
      MODIFF_PYTHON: ${{ github.workspace }}/MoDiff/.venv/bin/python
      MODIFF_BACKEND_PYTHON: ${{ github.workspace }}/MoDiff/.venv/bin/python
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: MoDiff-client
      - name: Check out the matching backend contract
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: sdevil7th/MoDiff
          ref: b2c7f81f05203d6d88a0bb36d41bc78e58f4cf64
          path: MoDiff
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: MoDiff-client/.nvmrc
          cache: npm
          cache-dependency-path: MoDiff-client/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: '0.11.26'
      - name: Install the reviewed CPU backend and test dependencies
        working-directory: MoDiff
        run: |
          python -m modiff.install --accelerator cpu --backend-only --non-interactive --json
          uv pip install --python .venv/bin/python -r requirements/test.txt
          uv pip check --python .venv/bin/python
          .venv/bin/python -m modiff.preflight --json --fail-on-error
      - run: npx playwright install --with-deps chromium
      - run: npm run check
      - run: npm run check:ui
      - name: Upload failed browser evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-failure-${{ github.run_id }}
          path: |
            MoDiff-client/playwright-report/
            MoDiff-client/test-results/
          if-no-files-found: ignore
          retention-days: 7

  platform-smoke:
    name: Platform smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lock:integrity
      - run: npm run licenses:check
      - name: Parse PowerShell launchers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          foreach ($path in @('install-dev.ps1', 'run-dev.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $path),
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$path`: $($_.Message)" }
              exit 1
            }
          }
      - name: List live-backend E2E on Windows
        if: runner.os == 'Windows'
        run: npm run e2e:studio:live-backend -- --list
      - run: npm run typecheck
      - run: npm run build
